{% comment %}
Reusable empty state.
Usage: {% include "core/_components/empty_state.html" with title="No tasks yet" body="Tap + Add Task to get started." %}
{% endcomment %}
<div class="flex flex-col items-center justify-center text-center py-10 px-4">
  {% if icon %}<span class="text-4xl mb-3">{{ icon }}</span>{% endif %}
  <p class="text-sm font-medium text-gray-500">{{ title }}</p>
  {% if body %}<p class="text-xs text-gray-400 mt-1">{{ body }}</p>{% endif %}
</div>
