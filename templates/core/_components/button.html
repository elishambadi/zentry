{% comment %}
Reusable button.
Usage: {% include "core/_components/button.html" with label="Save" variant="primary" %}
Options:
  variant: primary | secondary | ghost | danger | success
  size: sm | md
  type: button | submit
  href: optional — renders an <a> instead of <button>
  full: if "true", makes it w-full
Add extra classes/attrs via 'extra' (string).
{% endcomment %}
{% if href %}
<a href="{{ href }}"
   class="inline-flex items-center justify-center gap-1.5 font-medium transition-colors rounded-lg {% if full == 'true' %}w-full{% endif %}
   {% if size == 'sm' %}text-xs px-3 py-1.5{% else %}text-sm px-4 py-2{% endif %}
   {% if variant == 'primary' %}bg-primary-600 hover:bg-primary-700 text-white{% elif variant == 'secondary' %}bg-white border border-gray-300 text-gray-700 hover:bg-gray-50{% elif variant == 'ghost' %}text-gray-600 hover:bg-gray-100{% elif variant == 'danger' %}text-danger-600 hover:bg-danger-50{% else %}bg-success-600 hover:bg-success-700 text-white{% endif %}
   {{ extra }}">{{ label }}</a>
{% else %}
<button type="{% if type %}{{ type }}{% else %}button{% endif %}"
        {% if onclick %}onclick="{{ onclick }}"{% endif %}
        {% if disabled %}disabled{% endif %}
   class="inline-flex items-center justify-center gap-1.5 font-medium transition-colors rounded-lg {% if full == 'true' %}w-full{% endif %}
   {% if size == 'sm' %}text-xs px-3 py-1.5{% else %}text-sm px-4 py-2{% endif %}
   {% if variant == 'primary' %}bg-primary-600 hover:bg-primary-700 text-white{% elif variant == 'secondary' %}bg-white border border-gray-300 text-gray-700 hover:bg-gray-50{% elif variant == 'ghost' %}text-gray-600 hover:bg-gray-100{% elif variant == 'danger' %}text-danger-600 hover:bg-danger-50{% else %}bg-success-600 hover:bg-success-700 text-white{% endif %}
   {% if disabled %}disabled:opacity-50 disabled:cursor-not-allowed{% endif %}
   {{ extra }}">{{ label }}</button>
{% endif %}
