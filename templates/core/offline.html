{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <title>Offline — Zentry</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f9fafb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --green: #16a34a;
      --green-dark: #15803d;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 26rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
    }
    .icon {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.25rem;
      border-radius: 1rem;
      background: var(--green);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 1.75rem;
      font-weight: 700;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.375rem; letter-spacing: -0.01em; }
    p { margin: 0 0 1.5rem; color: var(--muted); line-height: 1.6; font-size: 0.9375rem; }
    .actions { display: flex; flex-direction: column; gap: 0.625rem; }
    button, a {
      display: block;
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 0.625rem;
      font: inherit;
      font-weight: 600;
      font-size: 0.9375rem;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    button {
      border: 0;
      background: var(--green);
      color: #fff;
    }
    button:hover { background: var(--green-dark); }
    a {
      border: 1px solid var(--border);
      color: var(--text);
      background: #fff;
    }
    a:hover { background: #f3f4f6; }
    .status {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: var(--muted);
      min-height: 1rem;
    }
    .status.online { color: var(--green-dark); }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">Z</div>
    <h1>You're offline</h1>
    <p>Zentry needs a connection to load your tasks. Check your network and try again — nothing you saved before going offline has been lost.</p>
    <div class="actions">
      <button type="button" id="retry">Try again</button>
      <a href="/">Go to Zentry</a>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
  </main>

  <script>
    (function () {
      const status = document.getElementById('status');
      const retry = document.getElementById('retry');

      function showOnline() {
        if (navigator.onLine) {
          status.textContent = 'Connection restored — reloading…';
          status.classList.add('online');
          setTimeout(function () { window.location.reload(); }, 600);
        } else {
          status.textContent = 'Still offline.';
          status.classList.remove('online');
        }
      }

      retry.addEventListener('click', function () {
        if (navigator.onLine) {
          window.location.reload();
        } else {
          status.textContent = 'Still offline. Reconnect and try again.';
        }
      });

      window.addEventListener('online', showOnline);
      if (navigator.onLine) {
        status.textContent = 'Connection restored — reloading…';
        status.classList.add('online');
        setTimeout(function () { window.location.reload(); }, 600);
      }
    })();
  </script>
</body>
</html>
